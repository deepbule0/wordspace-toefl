plugins { id 'com.android.application' }

android {
    namespace 'cn.wordspace.toefl'
    compileSdk 36
    defaultConfig {
        applicationId 'cn.wordspace.toefl'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.1.3'
    }
    signingConfigs {
        personal {
            storeFile file('../../.signing/wordspace.keystore')
            storePassword System.getenv('WORDSPACE_SIGNING_PASSWORD')
            keyAlias 'wordspace'
            keyPassword System.getenv('WORDSPACE_SIGNING_PASSWORD')
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.personal; minifyEnabled false; debuggable false }
    }
    sourceSets { main { assets.srcDirs = ['../../public'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // ZXing 4.3.0's published POM omits its implementation dependencies.
    // Match the scanner's own pinned dependencies, rather than relying on android.useAndroidX.
    implementation 'androidx.core:core:1.6.0'
    implementation 'androidx.fragment:fragment:1.3.6'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
